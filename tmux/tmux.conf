# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.config/tmux/plugins/tpm/tpm'

# Colors: Tokyo Night "moon", the same palette as Neovim. Transparent background.
set -g status-style 'bg=default,fg=#828bb8'
set -g message-style 'bg=default,fg=#c8d3f5'
set -g message-command-style 'bg=default,fg=#c8d3f5'
setw -g mode-style 'bg=#2d3f76,fg=#c8d3f5'
set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#82aaff,bold'
setw -g clock-mode-colour '#82aaff'

# Window name = project folder, e.g. "media"
set -g automatic-rename-format '#{b:pane_current_path}'

# Window list on the right, plain text: π + Claude mark (only where Claude runs), then the name.
# The current window's π, mark and name are white, inside [brackets]; the others are dim.
set -g status-justify right
setw -g window-status-style bg=default
setw -g window-status-current-style bg=default
setw -g window-status-separator ' #[fg=#9bd40b,bold]«#[nobold] '
setw -g window-status-format         '#{?@claude,#[fg=#{?window_active,#ffffff,#636da6}]π #{?#{==:#{@claude},needs},!,#{?#{==:#{@claude},working},#[nobold]#{E:@claude-spin},-}} #[nobold],}#[fg=#636da6]#W#[default]'
setw -g window-status-current-format '#[fg=#ffffff][#[default]#{?@claude,#[fg=#{?window_active,#ffffff,#636da6}]π #{?#{==:#{@claude},needs},!,#{?#{==:#{@claude},working},#[nobold]#{E:@claude-spin},-}} #[nobold],}#[fg=#ffffff]#W]#[default]'

# Left side: a "tmux" block with black bold text (like lualine's mode block): lime, pink while
# tmux waits for a key after the prefix. Then, like Neovim's statusline:  branch » command [folder]
# (drawn by git-branch.sh).
set -g status-left '#[fg=#000000,bg=#{?client_prefix,#ff4365,#9bd40b},bold] tmux #[fg=#{?client_prefix,#ff4365,#9bd40b},bg=default,nobold]#(~/.config/tmux/git-branch.sh "#{pane_current_path}" "#{pane_current_command}") '
set -g status-right ''
set -g status-left-length 100

# Number windows and panes from 1 (prefix 1 = first window); close gaps when a window closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Space above the bar: an empty first line, the normal bar on the second line.
# (Reset first, so reloading this file copies the default bar, not the empty line.)
set -g status 2
set -gu status-format
set -gF 'status-format[1]' '#{status-format[0]}'
set -g 'status-format[0]' ''

# Move between windows: prefix h = left, prefix l = right.
# -r: after the prefix, you can press h/l several times in a row (within repeat-time, 500 ms).
bind -r h previous-window
bind -r l next-window

# Claude mark of a window, after a pink π (state is in @claude, set by ~/.local/bin/claude-status-hook);
#  ! needs me, # % @ $ * & working (flicker), - done.
# The flicker (@claude-spin) is set 4 times a second by ~/.config/waybar/scripts/claude-status while Claude works.
set -g @claude-spin '##'

# Redraw the bar every second, for the working flicker and the needs blink
set -g status-interval 1
